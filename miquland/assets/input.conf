# ==============================================================================
# input.conf — Hardware Peripherals & Input Configuration (Modular Sourced File)
# Miqu Desktop Ecosystem Wayland Compositor
# ==============================================================================
# Hardware peripheral configuration, XKB keymaps, touchpads, and continuous swipe physics.
input {
    # Keyboard layout & repeat behavior:
    keyboard {
        layout = us
        # variant =
        # options = grp:alt_shift_toggle,caps:escape
        # model =
        repeat_rate = 40
        repeat_delay = 250
    }

    # Touchpad gestures & ergonomics:
    touchpad {
        tap_to_click = true
        natural_scroll = false
        disable_while_typing = true
        accel_speed = 0.0
        accel_profile = adaptive
    }

    # Mouse pointer configuration:
    mouse {
        accel_speed = 0.0
        accel_profile = adaptive
        natural_scroll = false
    }

    # Touchscreen hardware association:
    touchscreen {
        # output = eDP-1
    }

    # Multi-finger trackpad and touchscreen workspace swipe physics:
    workspace_swipe {
        touchpad_multiplier = 1.0
        touchscreen_multiplier = 1.0
        swipe_threshold = 50
        touchscreen_threshold = 100
        cancel_ratio = 0.30
        min_speed_to_force = 0.3
        edge_resistance = 0.15
    }
}
