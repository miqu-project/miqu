# ==============================================================================
# autostart.conf — Session Startup & Daemons (Modular Sourced File)
# ==============================================================================
autostart {
    # Miqu Desktop Ecosystem native components
    miqupolkit
    miqudesk
    miquidle
    miqubg

    # System status bars & notification daemons
    miqubar
    miqunotify

    # Network & system tray applets (starts after status bar is ready)
    nm-applet

    # Clipboard manager persistence daemon
    wl-paste --watch cliphist store

    # XDG Desktop Portal backend refresh (required for OBS screen recording across compositor restarts)
    systemctl --user restart xdg-desktop-portal-wlr

    # Native Night Light:
    # Night light / blue light filter is built natively into miquland (Planckian blackbody engine).
    # Configure via 'gamma_enabled' and 'gamma_temperature' in the general section below,
    # or toggle on the fly using 'miquctl gamma toggle' / 'miquctl gamma <temp>'.
}

