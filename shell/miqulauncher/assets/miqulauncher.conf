# ==============================================================================
# miqulauncher Configuration File
# Modern app launcher, window switcher, and dmenu built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 1: Window & Grid Layout
# ==============================================================================
width = 800
height = 460
cell_size = 100
spacing = 10
edge_padding = 40

# Show descriptive subtitles across tabs (app generic names, window state, etc.)
show_subtitles = true

# Draw a 1px border around the highlighted/selected grid item
selection_border = false

# Draw a primary accent border outline when search bar is focused
search_focus_border = true

# Width of centered search bar as a percentage of window width (e.g. 55 for 55%, 100 for full width)
search_width_percent = 55

# Height in pixels of the search pill (modern standard is 42px)
search_height = 42

# Elevation level for the search pill (0 for flat, 1-4 for ambient floating drop shadow)
search_elevation = 1

# Presentation mode: grid (multi-column app tiles) or list (compact horizontal rows)
view_mode = grid

# Presentation mode specifically when running in dedicated -show search mode
# options: inherit (matches view_mode), list, or grid
search_view_mode = inherit

# ==============================================================================
# Section 2: miqutoolkit Appearance & Theming Overrides (Optional)
#
# By default, miqulauncher widgets automatically inherit all styling, typography,
# and color tokens from miqutoolkit:
#   1. ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config, if present)
#   2. /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit fallback baseline)
#
# Out of the box, miqulauncher requires NO manual color or font definitions and
# does NOT need to source miqutoolkit manually.
# However, you can override any setting for miqulauncher specifically below, or point
# to an external theme/color scheme using the 'source' directive.
# ==============================================================================

# --- Sourcing External Configurations / Color Schemes ---
# Use the 'source' or 'include' directive to load colors and metrics from another
# file. Sourced files are automatically monitored by the live inotify watcher, so
# changes reload instantly without restarting miqulauncher.
#
# source = ~/.config/miqusettings/current/miqutoolkit.conf
# source = ~/.config/miqutoolkit/miqutoolkit.conf
# source = /path/to/custom-theme.conf

