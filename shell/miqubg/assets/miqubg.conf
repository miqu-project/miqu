# ==============================================================================
# miqubg Configuration File
# Independent Wayland Wallpaper Daemon for Miquland
# ==============================================================================
#
# This configuration file defines active desktop wallpapers, scaling modes,
# and background colors across all connected monitors or per-monitor outputs.
#
# AGENTS.md Two-Tier Configuration Hierarchy:
#   Tier 1 (System Baseline) : /usr/share/miqubg/miqubg.conf
#   Tier 2 (User Config)     : ~/.config/miqubg/miqubg.conf
#
# To initialize or reset your user configuration from this baseline:
#   miqubg --init-config
#
# Scaling Modes (case-insensitive):
#   fill / cover    : Scale to fill output, cropping if necessary (default)
#   fit / contain   : Scale to fit inside output, letterboxing with background color
#   stretch         : Stretch image to fill output (ignores aspect ratio)
#   center          : Center image at 1:1 scale without scaling
#   tile            : Tile image repeatedly across output
#
# Colors:
#   6-digit (#RRGGBB) or 8-digit (#RRGGBBAA) hex code (default: #000000)
#
# Dynamic Theming & Decoupled Configuration:
#   External configuration files can be sourced using:
#   source = ~/.config/miqusettings/current/wallpaper.conf
# ==============================================================================

[general]
# ==============================================================================
# Global / Default Wallpaper
# ==============================================================================
# Hyprland / Miqu unified syntax:
#   wallpaper = [monitor], <path>, [fit_mode], [bg_color]
#
# Leaving the monitor field empty (or using '*') sets the default wallpaper
# applied to all monitors that do not have a dedicated per-monitor override.
wallpaper = , /usr/share/miqubg/wallpaper.png, cover, #000000

# ==============================================================================
# Per-Monitor Overrides (Examples)
# ==============================================================================
# Specify individual wallpapers, scaling modes, and background colors
# for specific monitor outputs (e.g. HDMI-A-1, eDP-1, DP-1).
#
# Examples:
# wallpaper = HDMI-A-1, /usr/share/miqubg/wallpaper.png, cover, #000000
# wallpaper = eDP-1, /usr/share/miqubg/wallpaper.png, fit, #1e1e2e
#
# Solid background color without an image:
# wallpaper = DP-1, , cover, #181825
