# ==============================================================================
# MiquPower Configuration File
# Authoritative Desktop Environment Power & Session Management built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 1: Application Options
# ==============================================================================

[general]
# Width and height of the power dialog card
width = 720
height = 460

# Backdrop dimming and window behavior
dim_backdrop = true
close_on_click_outside = false
close_on_escape = true

# Running application safety warning
# When true, checks for running applications before shutdown/reboot/logout
warn_running_apps = true
max_running_apps = 6

# Graceful shutdown timeout in milliseconds for miquland before force exit
graceful_timeout_ms = 2500

# Automatically lock screen before system suspension or hibernation
lock_before_suspend = true

[actions]
# Toggle individual power actions in the menu
enable_shutdown = true
enable_reboot = true
enable_suspend = true
enable_lock = true
enable_logout = true
enable_hibernate = false

# Custom execution command overrides (leave empty for standard systemd/miquland defaults)
# lock_cmd = miqulock
# shutdown_cmd =
# reboot_cmd =
# suspend_cmd =
# logout_cmd =


# ==============================================================================
# Section 2: miqutoolkit Appearance & Theming Overrides (Optional)
#
# By default, miqupower widgets (dialog cards, action buttons, icons, labels)
# automatically inherit all styling, typography, and color tokens from miqutoolkit:
#   1. ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config, if present)
#   2. /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit fallback baseline)
#
# Out of the box, miqupower requires NO manual color or font definitions and does
# NOT need to source miqutoolkit manually.
# However, you can override any setting for miqupower specifically below, or point
# to an external theme/color scheme using the 'source' directive.
# ==============================================================================

# --- Sourcing External Configurations / Color Schemes ---
# Use the 'source' or 'include' directive to load colors and metrics from another
# file. Sourced files are automatically monitored by the live inotify watcher, so
# changes reload instantly without restarting miqupower.
#
# source = ~/.config/miqusettings/current/miqutoolkit.conf
# source = ~/.config/miqutoolkit/miqutoolkit.conf
# source = /path/to/custom-theme.conf

# --- Typography & Metrics Overrides ---
# font = Sans
# font_size = 11
# h1_size = 20
# h2_size = 15
# h3_size = 13
# caption_size = 10
# icon_theme = hicolor
# corner_radius = 24
# border_width = 1
# card_elevation = 2.0
# tooltip_opacity = 90
# tooltip_elevation = 1.5

# --- Color Palette Overrides ---
# Colors accept 6-digit (#RRGGBB) or 8-digit (#RRGGBBAA) hex codes for alpha transparency.
# background = #11131cb0
# on_background = #e6ecf8
# surface = #151924f5
# on_surface = #e6ecf8
# surface_variant = #1f2537f0
# on_surface_variant = #8a99b5
# primary = #40a0ff
# on_primary = #ffffff
# primary_container = #205090
# on_primary_container = #ffffff
# outline = #2e384d80
# outline_variant = #4070b099
# backdrop = #00000080
