# ==============================================================================
# miqudesk Configuration File
# Interactive Desktop Canvas for Miquland built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 1: Application Options
# ==============================================================================

# ==============================================================================
# General Canvas Settings
# ==============================================================================
[general]
# Canvas grid snapping step in pixels (set to 1 to disable snap)
grid_snap = 10

# Start directly in widget layout edit mode (true/false)
edit_mode = false

# Font weight (set to true to enable bold text)
font_bold = false
shortcut_bold = false

# ==============================================================================
# Desktop App Shortcuts (.desktop files from ~/Desktop)
# ==============================================================================
[desktop]
# Max characters displayed for shortcut names before truncating with '…' (0 to disable)
desktop_max_chars = 14

# Shortcut card dimensions in pixels
shortcut_width = 84
shortcut_height = 92

# Target icon dimension in pixels
icon_size = 48

# Shortcut item background (set alpha or transparent #00000000)
shortcut_background = #00000000
shortcut_border_radius = 12

# Require double click to launch desktop shortcuts (true/false)
double_click = true

# Double click time threshold in milliseconds
double_click_time_ms = 400

# Grid placement of shortcut icons on the desktop
shortcuts_start_x = 480
shortcuts_start_y = 80
col_spacing = 96
row_spacing = 104
items_per_col = 5

# ==============================================================================
# Built-in Widgets
# ==============================================================================
# Clock is enabled and centered by default.
[clock]
enabled = true
format_24h = true
show_seconds = true
bold = false
x = 780
y = 460
width = 360
height = 145

[system]
enabled = false
x = 80
y = 245
width = 360
height = 135

# ==============================================================================
# Section 2: miqutoolkit Appearance & Theming Overrides (Optional)
#
# By default, miqudesk widgets (desktop canvas, app shortcuts, system & clock widgets)
# automatically inherit all styling, typography, and color tokens from miqutoolkit:
#   1. ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config, if present)
#   2. /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit fallback baseline)
#
# Out of the box, miqudesk requires NO manual color or font definitions and does
# NOT need to source miqutoolkit manually.
# However, you can override any setting for miqudesk specifically below, or point
# to an external theme/color scheme using the 'source' directive.
# ==============================================================================

# --- Sourcing External Configurations / Color Schemes ---
# Use the 'source' or 'include' directive to load colors and metrics from another
# file. Sourced files are automatically monitored by the live inotify watcher, so
# changes reload instantly without restarting miqudesk.
#
# source = ~/.config/miqusettings/current/miqutoolkit.conf
# source = ~/.config/miqutoolkit/miqutoolkit.conf
# source = /path/to/custom-theme.conf

# --- Typography & Metrics Overrides ---
# font = Sans
# font_size = 11
# h1_size = 20
