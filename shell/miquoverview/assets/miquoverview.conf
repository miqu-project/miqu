# ==============================================================================
# miquoverview Configuration
# GPU-accelerated workspace expose and overview plugin for miquland
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Dimensions & Metrics
# ------------------------------------------------------------------------------
edge_margin   = 48
corner_radius = 12
font          = Sans Bold 10

# ------------------------------------------------------------------------------
# 2. Visual Effects: Animation, Blur & Shadows
# ------------------------------------------------------------------------------
# Fluid VSync-locked open/close transitions
animation     = true
duration      = 200

# GPU Dual Kawase frosted glass backdrop blur
blur          = true
blur_alpha    = 1.0

# GPU box drop shadows for workspace cards
shadow        = true
shadow_radius = 16
shadow_blur   = 18.0
shadow_color  = #000000aa

# ------------------------------------------------------------------------------
# 3. miqutoolkit Appearance & Theming Overrides (Optional)
#
# By default, miquoverview automatically inherits all styling, typography,
# and color tokens from miqutoolkit (via ~/.config/miqusettings/current/miqutoolkit.conf
# or ~/.config/miqutoolkit/miqutoolkit.conf).
#
# Out of the box, miquoverview requires NO manual color or font definitions and
# does NOT need to source miqutoolkit manually.
# However, you can override any setting for miquoverview specifically below, or
# point to an external theme/color scheme using the 'source' directive.
# ------------------------------------------------------------------------------

# --- Sourcing External Configurations / Color Schemes ---
# Use the 'source' or 'include' directive to load colors and metrics from another
# file. Sourced files are automatically monitored by the live inotify watcher, so
# changes reload instantly without restarting miquoverview.
#
# source = ~/.config/miqusettings/current/miqutoolkit.conf
# source = ~/.config/miqutoolkit/miqutoolkit.conf
# source = /path/to/custom-theme.conf

# --- Color Palette Overrides ---
# Colors accept 6-digit (#RRGGBB) or 8-digit (#RRGGBBAA) hex codes for alpha transparency.
# background          = #11131cb0
# backdrop            = #00000080
# surface             = #151924f5
# surface_variant     = #1f2537f0
# on_surface          = #e6ecf8
# on_surface_variant  = #8a99b5
# primary             = #40a0ff
# on_primary          = #ffffff
# outline             = #2e384d80
# outline_variant     = #4070b099
