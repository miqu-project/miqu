# ==============================================================================
# MiquGallery Configuration File
# Fast Miller Columns Photo and Media Gallery built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 1: Application Options
# ==============================================================================

[general]
# Initial window dimensions
window_width = 1100
window_height = 700

# Default starting directory (~ for user home directory)
default_path = ~

# Show hidden photo directories by default
show_hidden = false

# Enable vim-style navigation keys (h/j/k/l)
vim_keys = true

# Terminal launcher command when opening terminal in directory
terminal_cmd = alacritty

[preview]
# Image preview quality (FullOriginal or ThumbnailFast)
image_preview_quality = FullOriginal


# ==============================================================================
# Section 2: miqutoolkit Appearance & Theming Overrides (Optional)
#
# By default, miqugallery widgets (cards, thumbnails, toolbars, buttons, text)
# automatically inherit all styling, typography, and color tokens from miqutoolkit:
#   1. ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config, if present)
#   2. /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit fallback baseline)
#
# Out of the box, miqugallery requires NO manual color or font definitions and
# does NOT need to source miqutoolkit manually.
# However, you can override any setting for miqugallery specifically below, or point
# to an external theme/color scheme using the 'source' directive.
# ==============================================================================

# --- Sourcing External Configurations / Color Schemes ---
# Use the 'source' or 'include' directive to load colors and metrics from another
# file. Sourced files are automatically monitored by the live inotify watcher, so
# changes reload instantly without restarting miqugallery.
#
# source = ~/.config/miqusettings/current/miqutoolkit.conf
# source = ~/.config/miqutoolkit/miqutoolkit.conf
# source = /path/to/custom-theme.conf

# --- Typography & Metrics Overrides ---
# font = Sans
# font_size = 11
# h1_size = 20
# h2_size = 15
# h3_size = 13
# caption_size = 10
# icon_theme = hicolor
# corner_radius = 18
# border_width = 1
# card_elevation = 0.0
# tooltip_opacity = 90
# tooltip_elevation = 1.5

# --- Color Palette Overrides ---
# Colors accept 6-digit (#RRGGBB) or 8-digit (#RRGGBBAA) hex codes for alpha transparency.
# background = #fff7fc80
# on_background = #201923
# surface = #fff7fc80
# on_surface = #000000
# surface_variant = #ebdfed
# on_surface_variant = #312a35
# primary = #540081
# on_primary = #ffffff
# primary_container = #9b00ea
# on_primary_container = #ffffff
# outline = #d8ccd9
# outline_variant = #e4d7e5
# backdrop = #00000080
