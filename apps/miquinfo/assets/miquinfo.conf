# --- Color Palette Overrides ---
# Colors accept 6-digit (#RRGGBB) or 8-digit (#RRGGBBAA) hex codes for alpha transparency.
# primary = #3584e4
# on_primary = #ffffff
# surface = #1e1e2e
# on_surface = #cdd6f4
# surface_variant = #313244
# on_surface_variant = #a6adc8
# outline = #45475a
# outline_variant = #585b70
# background = #181825
# on_background = #cdd6f4
# backdrop = #00000080
